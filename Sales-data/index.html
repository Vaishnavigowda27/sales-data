function filterData(region){ if(region==="ALL") return rawRecords; return rawRecords.filter(r=>r["Region"]===region); }
function renderAll(region){
  const dat = filterData(region);
  const totalSales = dat.reduce((a,b)=>a+(+b["Total Sales"]||0),0);
  const totalTarget = dat.reduce((a,b)=>a+(+b["Target"]||0),0);
  const hit = totalTarget? (totalSales/totalTarget) : null;
  const kpi = JSON.parse(JSON.stringify(kpiFig));
  kpi.data[0].value = totalSales; kpi.data[1].value = totalTarget; kpi.data[2].value = hit? hit*100: 0;
  Plotly.react("kpi", kpi.data, kpi.layout, {displayModeBar:false, responsive:true});
  const byRegion = {};
  dat.forEach(r=>{ const reg=r["Region"]; if(!byRegion[reg]) byRegion[reg]={sales:0,target:0}; byRegion[reg].sales += (+r["Total Sales"]||0); byRegion[reg].target += (+r["Target"]||0); });
  const regs = Object.keys(byRegion).sort((a,b)=>byRegion[b].sales-byRegion[a].sales);
  const salesVals = regs.map(r=>byRegion[r].sales);
  const hitVals = regs.map(r=> byRegion[r].target? (byRegion[r].sales/byRegion[r].target): null);
  const regionBar = {data:[{type:"bar", x:regs, y:salesVals, marker:{color:hitVals, colorscale:"Tealgrn", colorbar:{title:"Hit %"}}, hovertemplate:"%{x}<br>Sales: %{y:,}<br>Hit: %{marker.color:.1%}<extra></extra>"}], layout: regionFig.layout};
  Plotly.react("regionBar", regionBar.data, regionBar.layout, {displayModeBar:false, responsive:true});
  const dayNames=["Day1","Day2","Day3","Day4","Day5"];
  const daySums = dayNames.map(dn=> dat.reduce((a,b)=>a+(+b[dn]||0),0));
  const dailyLine = {data:[{type:"scatter", mode:"lines+markers", x:dayNames, y:daySums, line:{color:"#7dd3fc", width:3}}], layout: dailyFig.layout};
  Plotly.react("dailyLine", dailyLine.data, dailyLine.layout, {displayModeBar:false, responsive:true});
  const hitArr = dat.map(r=>+r["Target Hit %"]).filter(x=>!isNaN(x));
  const dist = {data:[{type:"histogram", x:hitArr, nbinsx:20, marker:{color:"#a78bfa"}}], layout: distFig.layout};
  dist.layout.xaxis = dist.layout.xaxis || {}; dist.layout.xaxis.tickformat = ".0%";
  Plotly.react("distHist", dist.data, dist.layout, {displayModeBar:false, responsive:true});
  const top = dat.slice().sort((a,b)=>(+b["Total Sales"]||0)-(+a["Total Sales"]||0)).slice(0,15).reverse();
  const topBar = {data:[{type:"bar", x:top.map(r=>+r["Total Sales"]||0), y:top.map(r=>r["Sales Executive"]), orientation:"h", marker:{color:"#34d399"}, hovertemplate:"%{y}<br>Sales: %{x:,}<extra></extra>"}], layout: topFig.layout};
  Plotly.react("topBar", topBar.data, topBar.layout, {displayModeBar:false, responsive:true});
  const low = dat.slice().sort((a,b)=>(+a["Target Hit %"]||0)-(+b["Target Hit %"]||0)).slice(0,15);
  const lowBar = {data:[{type:"bar", x:low.map(r=>+r["Target Hit %"]||0), y:low.map(r=>r["Sales Executive"]), orientation:"h", marker:{color:"#fb7185"}, hovertemplate:"%{y}<br>Hit: %{x:.1%}<extra></extra>"}], layout: lowFig.layout};
  lowBar.layout.xaxis = lowBar.layout.xaxis || {}; lowBar.layout.xaxis.tickformat = ".0%";
  Plotly.react("lowBar", lowBar.data, lowBar.layout, {displayModeBar:false, responsive:true});
  const cols=["Emp Code","Sales Executive","Region","Total Sales","Target","Target Hit %","Gap To Target","Avg Daily Sales"];
  const tbl = dat.slice().sort((a,b)=>(+b["Total Sales"]||0)-(+a["Total Sales"]||0)).slice(0,25);
  const header = cols.map(c=>`<th>${c}</th>`).join("");
  const rows = tbl.map(r=>`<tr><td>${r["Emp Code"]||""}</td><td>${r["Sales Executive"]||""}</td><td>${r["Region"]||""}</td><td>${fmtNum(+r["Total Sales"]||0)}</td><td>${fmtNum(+r["Target"]||0)}</td><td>${fmtPct(+r["Target Hit %"])}</td><td>${fmtNum(+r["Gap To Target"]||0)}</td><td>${(+r["Avg Daily Sales"]||0).toFixed(1)}</td></tr>`).join("");
  document.getElementById("table").innerHTML = `<div class="muted" style="margin-bottom:10px;">Top 25 rows (sorted by Total Sales)</div><table><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table>`;
}
document.getElementById("regionSel").addEventListener("change", (e)=>renderAll(e.target.value));
